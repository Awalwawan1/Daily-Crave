<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6366f1">
<title>KasirPro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --primary:#6366f1;--primary-dark:#4f46e5;--primary-light:#eef2ff;
  --success:#10b981;--danger:#ef4444;--warning:#f59e0b;
  --dark:#1e293b;--gray:#64748b;--light:#f8fafc;--border:#e2e8f0;
  --shadow:0 4px 20px rgba(0,0,0,.08);--radius:16px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f1f5f9;color:var(--dark);padding-bottom:80px;min-height:100vh;transition:background .3s;}

/* HEADER */
.app-header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:16px 20px;border-radius:0 0 24px 24px;box-shadow:var(--shadow);position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;}
.header-left{display:flex;align-items:center;gap:12px;}
.brand-logo{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex-shrink:0;}
.brand-logo img{width:100%;height:100%;object-fit:cover;}
.app-header h1{font-size:17px;font-weight:700;line-height:1.2;}
.app-header p{font-size:12px;opacity:.85;margin-top:2px;}
.header-time{font-size:13px;font-weight:600;opacity:.95;background:rgba(255,255,255,.15);padding:6px 10px;border-radius:100px;}

.content{padding:20px;max-width:640px;margin:0 auto;}
.page{display:none;animation:fade .25s ease;}
.page.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.06);z-index:200;border-top:1px solid var(--border);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;color:var(--gray);font-size:11px;font-weight:500;cursor:pointer;transition:.2s;border-radius:12px;background:none;border:none;font-family:inherit;}
.nav-item.active{color:var(--primary);transform:translateY(-2px);}
.nav-item svg{width:22px;height:22px;transition:.2s;}
.nav-item.active svg{transform:scale(1.15);}

/* STATS */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.stat-card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.stat-card .icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.stat-card h3{font-size:12px;color:var(--gray);font-weight:500;}
.stat-card .value{font-size:20px;font-weight:700;margin-top:2px;}

.section-title{font-size:15px;font-weight:700;margin:20px 0 12px;display:flex;align-items:center;gap:8px;}
.section-title::before{content:'';width:4px;height:16px;background:var(--primary);border-radius:2px;transition:background .3s;}
.section-label{font-size:13px;font-weight:600;margin:12px 0 8px;color:var(--gray);}
.card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;}

/* KASIR */
.search-box{position:relative;margin-bottom:16px;}
.search-box input{width:100%;padding:14px 16px 14px 44px;border:2px solid var(--border);border-radius:var(--radius);font-size:14px;outline:none;transition:.2s;background:#fff;}
.search-box input:focus{border-color:var(--primary);}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--gray);}
.category-tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;scrollbar-width:none;}
.category-tabs::-webkit-scrollbar{display:none;}
.cat-chip{padding:8px 16px;border-radius:100px;background:#fff;border:1px solid var(--border);font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;transition:.2s;color:var(--dark);font-family:inherit;}
.cat-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.product-card{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.2s;position:relative;}
.product-card:active{transform:scale(.97);}
.product-thumb{height:90px;background:linear-gradient(135deg,var(--primary-light),var(--primary));display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#fff;transition:.3s;}
.product-info{padding:10px 12px;}
.product-info h4{font-size:13px;font-weight:600;margin-bottom:2px;}
.product-info .price{font-size:13px;color:var(--primary);font-weight:700;}
.product-info .stock{font-size:11px;color:var(--gray);margin-top:2px;}
.out-of-stock{position:absolute;top:8px;right:8px;background:var(--danger);color:#fff;font-size:10px;padding:2px 8px;border-radius:100px;font-weight:600;}

/* CART FAB */
.cart-fab{position:fixed;bottom:90px;right:20px;width:60px;height:60px;border-radius:50%;background:var(--primary);color:#fff;border:none;box-shadow:0 8px 24px rgba(99,102,241,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:150;transition:.2s;font-size:26px;}
.cart-fab:active{transform:scale(.92);}
.cart-badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:11px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;border:2px solid #fff;}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:500;backdrop-filter:blur(2px);}
.modal-backdrop.show{display:flex;}
.modal{background:#fff;width:100%;max-width:640px;border-radius:24px 24px 0 0;max-height:85vh;display:flex;flex-direction:column;animation:slideUp .25s ease;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:none;}}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-header h3{font-size:16px;font-weight:700;}
.modal-close{background:var(--light);border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;font-family:inherit;}
.modal-body{padding:16px 20px;overflow-y:auto;flex:1;}
.modal-footer{padding:16px 20px;border-top:1px solid var(--border);}

/* CART */
.cart-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.cart-item:last-child{border-bottom:none;}
.cart-item-info{flex:1;}
.cart-item-info h4{font-size:14px;font-weight:600;}
.cart-item-info p{font-size:12px;color:var(--gray);}
.qty-control{display:flex;align-items:center;gap:8px;background:var(--light);border-radius:100px;padding:4px;}
.qty-btn{width:28px;height:28px;border-radius:50%;border:none;background:#fff;font-weight:700;cursor:pointer;font-size:16px;box-shadow:0 2px 4px rgba(0,0,0,.08);color:var(--primary);font-family:inherit;}
.qty-control span{font-size:14px;font-weight:600;min-width:20px;text-align:center;}

/* TOTAL & BAYAR */
.total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:15px;}
.total-row strong{color:var(--primary);font-size:20px;transition:color .3s;}

.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pay-btn{padding:14px;border:2px solid var(--border);border-radius:12px;background:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s;color:var(--dark);}
.pay-btn.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary-dark);}

.cash-box{margin-top:12px;}
.cash-box label{font-size:12px;font-weight:600;color:var(--gray);display:block;margin-bottom:6px;}
.cash-box input{width:100%;padding:14px;border:2px solid var(--border);border-radius:12px;font-size:18px;font-weight:700;text-align:right;outline:none;font-family:inherit;transition:.2s;}
.cash-box input:focus{border-color:var(--primary);}
.change-row{display:flex;justify-content:space-between;margin-top:8px;font-size:14px;font-weight:600;color:var(--success);}

.qris-box{margin-top:12px;padding:16px;background:#fff;border:2px dashed var(--border);border-radius:12px;text-align:center;}
.qris-box .qr-ph{width:150px;height:150px;margin:0 auto 8px;background:repeating-linear-gradient(45deg,#f1f5f9,#f1f5f9 10px,#e2e8f0 10px,#e2e8f0 20px);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gray);font-size:12px;text-align:center;padding:8px;}
.qris-box p{font-size:12px;color:var(--gray);}

/* BUTTONS */
.btn{width:100%;padding:14px;border:none;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-success{background:var(--success);color:#fff;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-outline{background:#fff;color:var(--dark);border:1px solid var(--border);}
.btn:disabled{opacity:.6;cursor:not-allowed;}

/* STOK */
.stok-item{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#fff;border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow);}
.stok-item-info h4{font-size:14px;font-weight:600;}
.stok-item-info p{font-size:12px;color:var(--gray);margin-top:2px;}
.stok-badge{padding:6px 12px;border-radius:100px;font-size:12px;font-weight:700;}
.stok-badge.ok{background:#d1fae5;color:var(--success);}
.stok-badge.low{background:#fef3c7;color:var(--warning);}
.stok-badge.out{background:#fee2e2;color:var(--danger);}

/* MENU */
.menu-cat{margin-bottom:20px;}
.menu-cat h3{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;}
.menu-item{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:8px;box-shadow:var(--shadow);}
.menu-item h4{font-size:14px;font-weight:600;}
.menu-item p{font-size:12px;color:var(--gray);margin-top:2px;}

/* FORM */
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
.form-group input,.form-group select{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:12px;font-size:14px;outline:none;transition:.2s;font-family:inherit;background:#fff;}
.form-group input:focus,.form-group select:focus{border-color:var(--primary);}

/* PENGATURAN TOKO */
.logo-row{display:flex;align-items:center;gap:12px;}
.logo-preview{width:64px;height:64px;border-radius:16px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;flex-shrink:0;}
.logo-preview img{width:100%;height:100%;object-fit:cover;}

/* TEMA PICKER */
.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
.theme-chip{height:56px;border-radius:16px;border:3px solid transparent;cursor:pointer;transition:.2s;position:relative;}
.theme-chip.active{border-color:var(--dark);transform:scale(1.05);}
.theme-chip::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:700;opacity:0;transition:.2s;}
.theme-chip.active::after{opacity:1;}

/* TOAST */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:12px 20px;border-radius:100px;font-size:13px;font-weight:500;opacity:0;transition:.3s;z-index:1000;pointer-events:none;max-width:90%;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.success{background:var(--success);}
.toast.error{background:var(--danger);}

/* LOADING & EMPTY */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px;color:var(--gray);}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty-state{text-align:center;padding:40px 20px;color:var(--gray);}
.empty-state svg{width:64px;height:64px;opacity:.3;margin-bottom:12px;}
.empty-state p{font-size:14px;}

/* RECEIPT & TRX */
.receipt{font-family:'Courier New',monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;padding:16px;background:var(--light);border-radius:12px;}
.trx-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
.trx-row:last-child{border-bottom:none;}
.trx-row .left h4{font-size:13px;font-weight:600;}
.trx-row .left p{font-size:11px;color:var(--gray);margin-top:2px;}
.trx-row .right{font-size:13px;font-weight:700;color:var(--success);text-align:right;}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <div class="brand-logo" id="brandLogo">🏪</div>
    <div>
      <h1 id="brandName">KasirPro</h1>
      <p id="pageSubtitle">Dashboard</p>
    </div>
  </div>
  <div class="header-time" id="headerTime">--:--</div>
</header>

<main class="content">

  <!-- ============ DASHBOARD ============ -->
  <section id="page-dashboard" class="page active">
    <div class="stat-grid">
      <div class="stat-card">
        <div class="icon" style="background:var(--primary-light);color:var(--primary)">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <h3>Pendapatan Hari Ini</h3>
        <div class="value" id="statPendapatan">Rp 0</div>
      </div>
      <div class="stat-card">
        <div class="icon" style="background:#d1fae5;color:#10b981">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
        </div>
        <h3>Transaksi Hari Ini</h3>
        <div class="value" id="statTransaksi">0</div>
      </div>
      <div class="stat-card">
        <div class="icon" style="background:#fef3c7;color:#f59e0b">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7 12 3 4 7v10l8 4 8-4V7zM4 7l8 4 8-4M12 21V11"/></svg>
        </div>
        <h3>Total Produk</h3>
        <div class="value" id="statProduk">0</div>
      </div>
      <div class="stat-card">
        <div class="icon" style="background:#fee2e2;color:#ef4444">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>
        </div>
        <h3>Stok Menipis</h3>
        <div class="value" id="statStokRendah">0</div>
      </div>
    </div>
    <div class="section-title">Transaksi Terakhir</div>
    <div id="recentTrx"></div>
  </section>

  <!-- ============ KASIR ============ -->
  <section id="page-kasir" class="page">
    <div class="search-box">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchProduk" placeholder="Cari produk..." oninput="onSearch(this.value)">
    </div>
    <div class="category-tabs" id="categoryTabs"></div>
    <div class="product-grid" id="productGrid"></div>
    <button class="cart-fab" onclick="openCart()">
      <svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="cart-badge" id="cartBadge" style="display:none">0</span>
    </button>
  </section>

  <!-- ============ STOK ============ -->
  <section id="page-stok" class="page">
    <button class="btn btn-primary" style="margin-bottom:16px" onclick="openModal('addProdukModal')">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      Tambah Produk
    </button>
    <div id="stokList"></div>
  </section>

  <!-- ============ MENU (Pengaturan + Tema + Menu Kafe) ============ -->
  <section id="page-menu" class="page">

    <!-- Pengaturan Toko -->
    <div class="section-title">Pengaturan Toko</div>
    <div class="card">
      <div class="form-group">
        <label>Nama Toko</label>
        <input id="settingNama" placeholder="Nama toko Anda">
      </div>
      <div class="form-group">
        <label>Logo Toko</label>
        <div class="logo-row">
          <div class="logo-preview" id="logoPreview">🏪</div>
          <input type="file" id="logoUpload" accept="image/*" onchange="uploadLogo(event)" style="display:none">
          <button class="btn btn-outline" style="width:auto;padding:10px 16px" onclick="document.getElementById('logoUpload').click()">Pilih Gambar</button>
        </div>
      </div>
      <button class="btn btn-primary" onclick="saveStore()">Simpan Pengaturan</button>
    </div>

    <!-- Tema Warna -->
    <div class="section-title">Tema Warna</div>
    <div class="theme-grid" id="themeGrid"></div>

    <!-- Menu Kafe -->
    <div class="section-title">Menu Kafe</div>
    <div id="menuList"></div>

  </section>

</main>

<!-- ============ BOTTOM NAV ============ -->
<nav class="bottom-nav">
  <button class="nav-item active" data-page="dashboard" onclick="switchPage('dashboard')">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <span>Dashboard</span>
  </button>
  <button class="nav-item" data-page="kasir" onclick="switchPage('kasir')">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    <span>Kasir</span>
  </button>
  <button class="nav-item" data-page="stok" onclick="switchPage('stok')">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7 12 3 4 7v10l8 4 8-4V7zM4 7l8 4 8-4M12 21V11"/></svg>
    <span>Stok</span>
  </button>
  <button class="nav-item" data-page="menu" onclick="switchPage('menu')">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span>Menu</span>
  </button>
</nav>

<!-- ============ CART MODAL (dengan Tunai/QRIS) ============ -->
<div class="modal-backdrop" id="cartModal">
  <div class="modal">
    <div class="modal-header">
      <h3>🛒 Keranjang</h3>
      <button class="modal-close" onclick="closeModal('cartModal')">✕</button>
    </div>
    <div class="modal-body" id="cartBody"></div>
    <div class="modal-footer">
      <div class="total-row">
        <span>Total</span>
        <strong id="cartTotal">Rp 0</strong>
      </div>

      <div class="section-label">Metode Pembayaran</div>
      <div class="pay-grid">
        <button class="pay-btn active" id="payTunai" onclick="setPayMethod('tunai')">💵 Tunai</button>
        <button class="pay-btn" id="payQris" onclick="setPayMethod('qris')">📱 QRIS</button>
      </div>

      <!-- Detail pembayaran dinamis -->
      <div id="payDetail"></div>

      <button class="btn btn-success" id="btnCheckout" onclick="checkout()" style="margin-top:12px">
        💳 Bayar Sekarang
      </button>
    </div>
  </div>
</div>

<!-- ============ ADD PRODUK MODAL ============ -->
<div class="modal-backdrop" id="addProdukModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Tambah Produk</h3>
      <button class="modal-close" onclick="closeModal('addProdukModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label>ID Produk</label><input id="pId" placeholder="P001"></div>
      <div class="form-group"><label>Nama Produk</label><input id="pNama" placeholder="Nama produk"></div>
      <div class="form-group"><label>Harga (Rp)</label><input id="pHarga" type="number" placeholder="15000"></div>
      <div class="form-group"><label>Stok</label><input id="pStok" type="number" placeholder="50"></div>
      <div class="form-group"><label>Kategori</label>
        <select id="pKategori">
          <option value="Makanan">Makanan</option>
          <option value="Minuman">Minuman</option>
          <option value="Snack">Snack</option>
          <option value="Lainnya">Lainnya</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="saveProduk()">Simpan Produk</button>
    </div>
  </div>
</div>

<!-- ============ RECEIPT MODAL ============ -->
<div class="modal-backdrop" id="receiptModal">
  <div class="modal">
    <div class="modal-header">
      <h3>✅ Transaksi Berhasil</h3>
      <button class="modal-close" onclick="closeModal('receiptModal')">✕</button>
    </div>
    <div class="modal-body" id="receiptBody"></div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="closeModal('receiptModal')">Selesai</button>
    </div>
  </div>
</div>

<!-- ============ TOAST ============ -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   KASIRPRO — app.js (inline)
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbw0H5x2pjov-jKBB4cqQC3cOR6c-95glo37Nqr77Zvesi8IDzbd0BPuOkpfaGMnP0XD/exec";
const NAMA_KASIR = "Kasir";
const TZ = "Asia/Singapore"; // GMT+8

const THEMES = [
  { name:'Indigo',  c:'#6366f1', d:'#4f46e5', l:'#eef2ff' },
  { name:'Rose',    c:'#f43f5e', d:'#e11d48', l:'#fff1f2' },
  { name:'Emerald', c:'#10b981', d:'#059669', l:'#ecfdf5' },
  { name:'Amber',   c:'#f59e0b', d:'#d97706', l:'#fffbeb' },
  { name:'Sky',     c:'#0ea5e9', d:'#0284c7', l:'#f0f9ff' },
  { name:'Violet',  c:'#8b5cf6', d:'#7c3aed', l:'#f5f3ff' },
  { name:'Slate',   c:'#475569', d:'#334155', l:'#f1f5f9' },
  { name:'Pink',    c:'#ec4899', d:'#db2777', l:'#fdf2f8' }
];

let state = {
  produk: [], transaksi: [], menu: [], cart: {},
  kategori: 'Semua', search: '', loading: true,
  payMethod: 'tunai', cashPaid: 0,
  store: { name: 'KasirPro', logo: '' },
  themeIndex: 0
};

const rupiah = n => 'Rp ' + (Number(n)||0).toLocaleString('id-ID');
const $ = id => document.getElementById(id);

function showToast(msg, type=''){
  const t = $('toast'); t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.className = 'toast ' + type, 2500);
}
function openModal(id){ $(id).classList.add('show'); }
function closeModal(id){ $(id).classList.remove('show'); }

/* ---------- WAKTU GMT+8 ---------- */
function nowGMT8(){ return new Date(new Date().toLocaleString('en-US',{timeZone:TZ})); }
function updateClock(){
  const el = $('headerTime'); if(!el) return;
  el.textContent = new Date().toLocaleTimeString('id-ID',{timeZone:TZ,hour:'2-digit',minute:'2-digit'});
}

/* ---------- API ---------- */
async function apiGet(action){
  const res = await fetch(API_URL+'?action='+action,{redirect:'follow'});
  const json = await res.json();
  if(json.status!=='success') throw new Error(json.message||'Gagal memuat');
  return json.data;
}
async function apiPost(payload){
  const res = await fetch(API_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload), redirect:'follow'
  });
  const json = await res.json();
  if(json.status!=='success') throw new Error(json.message||'Gagal memproses');
  return json;
}

/* ---------- TEMA ---------- */
function applyTheme(i){
  const t = THEMES[i] || THEMES[0];
  document.documentElement.style.setProperty('--primary', t.c);
  document.documentElement.style.setProperty('--primary-dark', t.d);
  document.documentElement.style.setProperty('--primary-light', t.l);
  state.themeIndex = i;
  localStorage.setItem('kasir_theme', String(i));
  document.querySelectorAll('.theme-chip').forEach((el,x)=> el.classList.toggle('active', x===i));
}
function renderThemePicker(){
  const g = $('themeGrid'); if(!g) return;
  g.innerHTML = THEMES.map((t,i)=>
    `<div class="theme-chip ${i===state.themeIndex?'active':''}" style="background:linear-gradient(135deg,${t.c},${t.d})" onclick="applyTheme(${i})"></div>`
  ).join('');
}

/* ---------- PENGATURAN TOKO ---------- */
/* loadStore: ambil dari Sheets */
async function loadStore(){
  try{
    const data = await apiGet('pengaturan');
    state.store = {
      name: data.nama || 'KasirPro',
      logo: data.logo || ''
    };
  }catch(e){
    state.store = { name:'KasirPro', logo:'' };
  }
  applyStoreUI();
}

/* saveStore: simpan ke Sheets */
async function saveStore(){
  const nama = $('settingNama').value.trim() || 'KasirPro';
  state.store.name = nama;
  applyStoreUI(); // update UI dulu biar responsif
  try{
    await apiPost({
      action: 'simpanPengaturan',
      nama: state.store.name,
      logo: state.store.logo
    });
    showToast('Pengaturan tersimpan (sinkron)','success');
  }catch(err){
    showToast('Gagal simpan: '+err.message,'error');
  }
}

/* uploadLogo: simpan ke Sheets juga */
function uploadLogo(ev){
  const f = ev.target.files[0];
  if(!f) return;

  // validasi tipe
  if(!f.type.startsWith('image/')){ showToast('File harus gambar','error'); return; }

  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = async () => {
      // Kompres ke max 200x200 px, JPEG kualitas 0.75
      const maxSize = 200;
      let w = img.width, h = img.height;
      if(w > h){ if(w > maxSize){ h = h * maxSize / w; w = maxSize; } }
      else     { if(h > maxSize){ w = w * maxSize / h; h = maxSize; } }

      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);

      // JPEG kualitas 0.75 → biasanya 8-20KB
      const compressed = canvas.toDataURL('image/jpeg', 0.75);
      const sizeKB = Math.round(compressed.length * 0.75 / 1024);

      state.store.logo = compressed;
      applyStoreUI();

      try{
        await apiPost({
          action: 'simpanPengaturan',
          nama: state.store.name,
          logo: compressed
        });
        showToast(`Logo tersimpan (${sizeKB}KB, sinkron)`, 'success');
      }catch(err){
        showToast('Gagal simpan logo: ' + err.message, 'error');
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(f);
}

/* DOMContentLoaded: loadStore jadi async */
document.addEventListener('DOMContentLoaded', async () => {
  const savedTheme = Number(localStorage.getItem('kasir_theme')||0);
  applyTheme(isNaN(savedTheme)?0:savedTheme);
  renderThemePicker();
  updateClock();
  setInterval(updateClock, 30000);
  await loadStore();   // ← sekarang ambil dari Sheets
  await loadAll();
  renderDashboard();
});

/* ---------- NAVIGASI ---------- */
const PAGE_META = {
  dashboard:{title:'Dashboard', subtitle:'Selamat datang kembali 👋'},
  kasir:{title:'Kasir', subtitle:'Pilih produk untuk transaksi'},
  stok:{title:'Stok', subtitle:'Kelola inventaris produk'},
  menu:{title:'Menu', subtitle:'Pengaturan & daftar menu'}
};
function switchPage(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  $('page-'+page).classList.add('active');
  const b = document.querySelector('.nav-item[data-page="'+page+'"]'); if(b) b.classList.add('active');
  $('pageSubtitle').textContent = PAGE_META[page].subtitle;
  if(page==='dashboard') renderDashboard();
  if(page==='kasir') renderKasir();
  if(page==='stok') renderStok();
  if(page==='menu'){ renderThemePicker(); renderMenu(); }
}

/* ---------- LOAD ---------- */
async function loadAll(){
  try{
    const [produk,transaksi,menu] = await Promise.all([
      apiGet('produk'), apiGet('transaksi').catch(()=>[]), apiGet('menu').catch(()=>[])
    ]);
    state.produk=produk||[]; state.transaksi=transaksi||[]; state.menu=menu||[];
    state.loading=false;
  }catch(err){
    state.loading=false;
    showToast('Gagal memuat: '+err.message,'error');
  }
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(){
  if(state.loading){ $('recentTrx').innerHTML='<div class="loading"><div class="spinner"></div><p>Memuat...</p></div>'; return; }
  const today = nowGMT8();
  const isToday = d => new Date(d).toDateString() === today.toDateString();
  const trxToday = state.transaksi.filter(t=>isToday(t.waktu));
  const pendapatan = trxToday.reduce((s,t)=>s+(Number(t.total)||0),0);
  const stokRendah = state.produk.filter(p=>p.stok<=5).length;
  $('statPendapatan').textContent = rupiah(pendapatan);
  $('statTransaksi').textContent = new Set(trxToday.map(t=>t.idTransaksi)).size;
  $('statProduk').textContent = state.produk.length;
  $('statStokRendah').textContent = stokRendah;

  const groups = {};
  state.transaksi.forEach(t=>{
    if(!groups[t.idTransaksi]) groups[t.idTransaksi]={id:t.idTransaksi,waktu:t.waktu,total:0,items:[]};
    groups[t.idTransaksi].total += Number(t.total)||0;
    groups[t.idTransaksi].items.push(t.produk+' x'+t.qty);
  });
  const recent = Object.values(groups).sort((a,b)=>new Date(b.waktu)-new Date(a.waktu)).slice(0,5);
  if(!recent.length){ $('recentTrx').innerHTML='<div class="empty-state"><p>Belum ada transaksi</p></div>'; return; }
  $('recentTrx').innerHTML = '<div class="card">' + recent.map(t=>
    '<div class="trx-row"><div class="left"><h4>'+t.id+'</h4><p>'+t.items.join(', ')+'</p></div><div class="right">'+rupiah(t.total)+'</div></div>'
  ).join('') + '</div>';
}

/* ---------- KASIR ---------- */
function onSearch(v){ state.search = v; renderKasir(); }
function setKategori(k){ state.kategori = k; renderKasir(); }
function renderKasir(){
  if(state.loading){ $('productGrid').innerHTML='<div class="loading" style="grid-column:1/-1"><div class="spinner"></div><p>Memuat produk...</p></div>'; return; }
  const kategoriSet = ['Semua', ...new Set(state.produk.map(p=>p.kategori||'Umum'))];
  $('categoryTabs').innerHTML = kategoriSet.map(k=>
    '<button class="cat-chip '+(k===state.kategori?'active':'')+'" onclick="setKategori(\''+k+'\')">'+k+'</button>'
  ).join('');
  const q = state.search.toLowerCase();
  const filtered = state.produk.filter(p=>{
    const mk = state.kategori==='Semua' || (p.kategori||'Umum')===state.kategori;
    const mq = !q || p.nama.toLowerCase().includes(q) || p.id.toLowerCase().includes(q);
    return mk && mq;
  });
  if(!filtered.length){ $('productGrid').innerHTML='<div class="empty-state" style="grid-column:1/-1"><p>Produk tidak ditemukan</p></div>'; return; }
  $('productGrid').innerHTML = filtered.map(p=>
    '<div class="product-card" onclick="addToCart(\''+p.id+'\')">'+
      '<div class="product-thumb">'+(p.nama||'?').charAt(0).toUpperCase()+'</div>'+
      '<div class="product-info"><h4>'+p.nama+'</h4>'+
        '<div class="price">'+rupiah(p.harga)+'</div>'+
        '<div class="stock">Stok: '+p.stok+'</div></div>'+
      (p.stok<=0?'<span class="out-of-stock">HABIS</span>':'')+
    '</div>'
  ).join('');
  updateCartBadge();
}

/* ---------- CART ---------- */
function addToCart(id){
  const p = state.produk.find(x=>String(x.id)===String(id)); if(!p) return;
  if(p.stok<=0){ showToast('Stok habis','error'); return; }
  const cur = state.cart[id];
  if(cur && cur.qty>=p.stok){ showToast('Stok tidak cukup','error'); return; }
  if(cur) cur.qty++; else state.cart[id]={id:p.id,nama:p.nama,harga:p.harga,qty:1};
  updateCartBadge(); showToast(p.nama+' ditambahkan','success');
}
function updateCartBadge(){
  const total = Object.values(state.cart).reduce((s,i)=>s+i.qty,0);
  const b = $('cartBadge'); if(b){ b.textContent=total; b.style.display=total>0?'flex':'none'; }
}
function openCart(){ renderCart(); setPayMethod('tunai'); openModal('cartModal'); }
function renderCart(){
  const items = Object.values(state.cart);
  if(!items.length){
    $('cartBody').innerHTML = '<div class="empty-state"><p>Keranjang masih kosong</p></div>';
    $('cartTotal').textContent = 'Rp 0'; return;
  }
  $('cartBody').innerHTML = items.map(it=>
    '<div class="cart-item"><div class="cart-item-info"><h4>'+it.nama+'</h4><p>'+rupiah(it.harga)+'</p></div>'+
    '<div class="qty-control"><button class="qty-btn" onclick="changeQty(\''+it.id+'\',-1)">−</button>'+
    '<span>'+it.qty+'</span>'+
    '<button class="qty-btn" onclick="changeQty(\''+it.id+'\',1)">+</button></div></div>'
  ).join('');
  const total = items.reduce((s,i)=>s+i.qty*i.harga,0);
  $('cartTotal').textContent = rupiah(total);
  if(state.payMethod==='tunai') renderPayDetail();
}
function changeQty(id, delta){
  const p = state.produk.find(x=>String(x.id)===String(id));
  const cur = state.cart[id]; if(!cur) return;
  const nq = cur.qty + delta;
  if(nq<=0){ delete state.cart[id]; }
  else if(p && nq>p.stok){ showToast('Stok tidak cukup','error'); return; }
  else cur.qty = nq;
  renderCart(); updateCartBadge();
}

/* ---------- PEMBAYARAN ---------- */
function setPayMethod(m){
  state.payMethod = m;
  $('payTunai').classList.toggle('active', m==='tunai');
  $('payQris').classList.toggle('active', m==='qris');
  renderPayDetail();
}
function renderPayDetail(){
  const box = $('payDetail'); if(!box) return;
  const total = Object.values(state.cart).reduce((s,i)=>s+i.qty*i.harga,0);
  if(state.payMethod==='tunai'){
    box.innerHTML =
      '<div class="cash-box">'+
        '<label>Uang Diterima</label>'+
        '<input type="number" id="cashInput" placeholder="0" value="'+(state.cashPaid||'')+'" oninput="onCashInput(this.value)">'+
        '<div class="change-row"><span>Kembalian</span><span id="changeVal">Rp 0</span></div>'+
      '</div>';
    onCashInput(state.cashPaid||0);
  } else {
    box.innerHTML =
      '<div class="qris-box">'+
        '<div class="qr-ph">SCAN QRIS<br>(ganti dengan gambar QR toko Anda)</div>'+
        '<p>Total: <strong>'+rupiah(total)+'</strong></p>'+
        '<p style="margin-top:4px">Konfirmasi pembayaran setelah pelanggan scan.</p>'+
      '</div>';
  }
}
function onCashInput(v){
  state.cashPaid = Number(v)||0;
  const total = Object.values(state.cart).reduce((s,i)=>s+i.qty*i.harga,0);
  const kembalian = Math.max(0, state.cashPaid - total);
  const el = $('changeVal'); if(el) el.textContent = rupiah(kembalian);
}

/* ---------- CHECKOUT ---------- */
async function checkout(){
  const items = Object.values(state.cart);
  if(!items.length){ showToast('Keranjang kosong','error'); return; }
  const total = items.reduce((s,i)=>s+i.qty*i.harga,0);
  if(state.payMethod==='tunai' && state.cashPaid < total){
    showToast('Uang tunai kurang','error'); return;
  }
  const btn = $('btnCheckout');
  btn.disabled = true; const old = btn.textContent; btn.textContent = 'Memproses...';
  try{
    const res = await apiPost({
      action:'checkout',
      kasir: NAMA_KASIR,
      metode: state.payMethod,
      bayar: state.payMethod==='tunai' ? state.cashPaid : total,
      items: items.map(i=>({ id:i.id, nama:i.nama, harga:i.harga, qty:i.qty }))
    });
    showReceipt(res.idTransaksi, items, total, state.payMethod, state.cashPaid);
    state.cart = {}; state.cashPaid = 0;
    updateCartBadge();
    closeModal('cartModal');
    await loadAll();
    renderDashboard(); renderKasir();
  }catch(err){
    showToast('Gagal: '+err.message,'error');
  }finally{
    btn.disabled = false; btn.textContent = old;
  }
}

/* ---------- RECEIPT ---------- */
function showReceipt(idTrx, items, total, metode, bayar){
  const now = new Date().toLocaleString('id-ID',{timeZone:TZ, day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const nama = state.store.name;
  let txt = '========================\n';
  txt += '  ' + nama.toUpperCase() + '\n';
  txt += '========================\n';
  txt += 'ID    : ' + idTrx + '\n';
  txt += 'Waktu : ' + now + ' (GMT+8)\n';
  txt += 'Kasir : ' + NAMA_KASIR + '\n';
  txt += 'Metode: ' + (metode==='tunai'?'Tunai':'QRIS') + '\n';
  txt += '------------------------\n';
  items.forEach(it=>{
    txt += it.nama + '\n';
    txt += '  ' + it.qty + ' x ' + rupiah(it.harga) + ' = ' + rupiah(it.qty*it.harga) + '\n';
  });
  txt += '------------------------\n';
  txt += 'TOTAL : ' + rupiah(total) + '\n';
  if(metode==='tunai'){
    txt += 'Bayar : ' + rupiah(bayar) + '\n';
    txt += 'Kembali: ' + rupiah(bayar-total) + '\n';
  }
  txt += '========================\n';
  txt += '   Terima Kasih 🙏\n';
  $('receiptBody').innerHTML = '<div class="receipt">'+txt+'</div>';
  openModal('receiptModal');
}

/* ---------- STOK ---------- */
function renderStok(){
  if(state.loading){ $('stokList').innerHTML='<div class="loading"><div class="spinner"></div><p>Memuat...</p></div>'; return; }
  if(!state.produk.length){ $('stokList').innerHTML='<div class="empty-state"><p>Belum ada produk</p></div>'; return; }
  $('stokList').innerHTML = state.produk.map(p=>{
    let cls='ok', label=p.stok+' unit';
    if(p.stok<=0){ cls='out'; label='Habis'; }
    else if(p.stok<=5){ cls='low'; label=p.stok+' unit'; }
    return '<div class="stok-item"><div class="stok-item-info">'+
      '<h4>'+p.nama+'</h4>'+
      '<p>'+p.id+' • '+rupiah(p.harga)+' • '+(p.kategori||'Umum')+'</p></div>'+
      '<span class="stok-badge '+cls+'">'+label+'</span></div>';
  }).join('');
}
async function saveProduk(){
  const id = $('pId').value.trim();
  const nama = $('pNama').value.trim();
  const harga = Number($('pHarga').value);
  const stok = Number($('pStok').value);
  const kategori = $('pKategori').value;
  if(!id || !nama || !harga){ showToast('Lengkapi data produk','error'); return; }
  try{
    await apiPost({ action:'tambahProduk', id, nama, harga, stok, kategori });
    showToast('Produk ditambahkan','success');
    closeModal('addProdukModal');
    $('pId').value=''; $('pNama').value=''; $('pHarga').value=''; $('pStok').value='';
    await loadAll(); renderStok();
  }catch(err){ showToast('Gagal: '+err.message,'error'); }
}

/* ---------- MENU ---------- */
function renderMenu(){
  if(state.loading){ $('menuList').innerHTML='<div class="loading"><div class="spinner"></div><p>Memuat...</p></div>'; return; }
  if(!state.menu.length){ $('menuList').innerHTML='<div class="empty-state"><p>Belum ada menu tersedia</p></div>'; return; }
  const g = {};
  state.menu.forEach(m=>{ const k=m.kategori||'Lainnya'; if(!g[k])g[k]=[]; g[k].push(m); });
  $('menuList').innerHTML = Object.keys(g).map(k=>
    '<div class="menu-cat"><h3>'+k+'</h3>'+
    g[k].map(m=>'<div class="menu-item"><h4>'+m.nama+'</h4><p>'+(m.deskripsi||'')+'</p></div>').join('')+
    '</div>'
  ).join('');
}

/* ---------- INIT ---------- */
document.addEventListener('DOMContentLoaded', async () => {
  // load tema
  const savedTheme = Number(localStorage.getItem('kasir_theme')||0);
  applyTheme(isNaN(savedTheme)?0:savedTheme);
  // load toko
  loadStore();
  // render theme picker (untuk halaman menu)
  renderThemePicker();
  // jam GMT+8
  updateClock();
  setInterval(updateClock, 30000);
  // load data
  await loadAll();
  renderDashboard();
});
</script>
</body>
</html>
